<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 660" width="860" height="660" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#BDC3C7" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7F8C8D"/>
    </marker>
    <marker id="arrowR" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#27AE60"/>
    </marker>
    <marker id="arrowB" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4A90D9"/>
    </marker>
  </defs>

  <rect width="860" height="660" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="430" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2C3E50">Hardware Bridge — Simulation to Real Thread / Matter</text>
  <text x="430" y="52" text-anchor="middle" font-size="12" fill="#7F8C8D">--hw mode swaps the simulated radio for real OpenThread (OTBR) and Matter (chip-tool) back ends</text>

  <!-- Controller -->
  <rect x="305" y="70" width="250" height="56" rx="10" ry="10" fill="#FFFFFF" stroke="#2C3E50" stroke-width="2" filter="url(#shadow)"/>
  <text x="430" y="93" text-anchor="middle" font-size="13" font-weight="bold" fill="#2C3E50">matterthreads --hw</text>
  <text x="430" y="111" text-anchor="middle" font-size="10" fill="#7F8C8D">CLI controller · interactive hw&gt; REPL</text>

  <!-- mt_hw library panel -->
  <rect x="120" y="156" width="620" height="132" rx="12" ry="12" fill="#F7F9FC" stroke="#9B59B6" stroke-width="2" filter="url(#shadow)"/>
  <text x="430" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#9B59B6">mt_hw  —  hardware bridge library (ENABLE_HW_BRIDGE=ON)</text>

  <rect x="142" y="192" width="200" height="78" rx="8" ry="8" fill="#FFFFFF" stroke="#9B59B6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="242" y="214" text-anchor="middle" font-size="12" font-weight="bold" fill="#2C3E50">HardwareNode</text>
  <text x="242" y="232" text-anchor="middle" font-size="10" fill="#7F8C8D">commission · read / write</text>
  <text x="242" y="247" text-anchor="middle" font-size="10" fill="#7F8C8D">invoke · IHardwareNode</text>
  <text x="242" y="262" text-anchor="middle" font-size="10" fill="#7F8C8D">facade over both drivers</text>

  <rect x="372" y="192" width="160" height="78" rx="8" ry="8" fill="#FFFFFF" stroke="#4A90D9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="452" y="214" text-anchor="middle" font-size="12" font-weight="bold" fill="#2C3E50">ChipToolDriver</text>
  <text x="452" y="232" text-anchor="middle" font-size="10" fill="#7F8C8D">ProcessManager</text>
  <text x="452" y="247" text-anchor="middle" font-size="10" fill="#7F8C8D">spawns subprocess,</text>
  <text x="452" y="262" text-anchor="middle" font-size="10" fill="#7F8C8D">parses stdout</text>

  <rect x="558" y="192" width="160" height="78" rx="8" ry="8" fill="#FFFFFF" stroke="#27AE60" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="638" y="214" text-anchor="middle" font-size="12" font-weight="bold" fill="#2C3E50">OTBRClient</text>
  <text x="638" y="232" text-anchor="middle" font-size="10" fill="#7F8C8D">libcurl REST client</text>
  <text x="638" y="247" text-anchor="middle" font-size="10" fill="#7F8C8D">/node/* · /diagnostics</text>
  <text x="638" y="262" text-anchor="middle" font-size="10" fill="#7F8C8D">commissioner · SRP</text>

  <!-- Controller -> mt_hw -->
  <line x1="430" y1="126" x2="430" y2="154" stroke="#7F8C8D" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Matter path -->
  <rect x="352" y="356" width="200" height="64" rx="8" ry="8" fill="#EAF2FB" stroke="#4A90D9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="452" y="380" text-anchor="middle" font-size="12" font-weight="bold" fill="#2C3E50">chip-tool</text>
  <text x="452" y="398" text-anchor="middle" font-size="10" fill="#7F8C8D">connectedhomeip (CSA)</text>
  <text x="452" y="412" text-anchor="middle" font-size="10" fill="#7F8C8D">git submodule · subprocess</text>

  <rect x="352" y="470" width="200" height="58" rx="8" ry="8" fill="#FFFFFF" stroke="#4A90D9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="452" y="494" text-anchor="middle" font-size="12" font-weight="bold" fill="#2C3E50">Matter device</text>
  <text x="452" y="512" text-anchor="middle" font-size="10" fill="#7F8C8D">PASE / CASE · Interaction Model</text>

  <line x1="452" y1="270" x2="452" y2="354" stroke="#4A90D9" stroke-width="1.8" marker-end="url(#arrowB)"/>
  <text x="462" y="312" font-size="10" fill="#4A90D9">fork/exec + stdout parse</text>
  <line x1="452" y1="420" x2="452" y2="468" stroke="#4A90D9" stroke-width="1.8" marker-end="url(#arrowB)"/>
  <text x="462" y="448" font-size="10" fill="#4A90D9">Matter over IP</text>

  <!-- Thread path -->
  <rect x="600" y="356" width="220" height="64" rx="8" ry="8" fill="#EAF7EE" stroke="#27AE60" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="710" y="380" text-anchor="middle" font-size="12" font-weight="bold" fill="#2C3E50">otbr-agent (OTBR)</text>
  <text x="710" y="398" text-anchor="middle" font-size="10" fill="#7F8C8D">OpenThread Border Router</text>
  <text x="710" y="412" text-anchor="middle" font-size="10" fill="#7F8C8D">Google / Nest · Apache-2.0</text>

  <rect x="600" y="470" width="220" height="58" rx="8" ry="8" fill="#FFFFFF" stroke="#27AE60" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="710" y="494" text-anchor="middle" font-size="12" font-weight="bold" fill="#2C3E50">Thread mesh (802.15.4)</text>
  <text x="710" y="512" text-anchor="middle" font-size="10" fill="#7F8C8D">RCP radio · 6LoWPAN · MLE / SRP</text>

  <line x1="638" y1="270" x2="690" y2="354" stroke="#27AE60" stroke-width="1.8" marker-end="url(#arrowR)"/>
  <text x="648" y="312" font-size="10" fill="#27AE60">HTTP REST :8081</text>
  <line x1="710" y1="420" x2="710" y2="468" stroke="#27AE60" stroke-width="1.8" marker-end="url(#arrowR)"/>
  <text x="720" y="448" font-size="10" fill="#27AE60">Thread radio</text>

  <!-- Simulation contrast box -->
  <rect x="40" y="356" width="280" height="172" rx="12" ry="12" fill="#FBF6F9" stroke="#E67E22" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="180" y="378" text-anchor="middle" font-size="12" font-weight="bold" fill="#E67E22">Default (no --hw): all simulated</text>
  <text x="56" y="402" font-size="10.5" fill="#2C3E50">mt_thread — custom distance-vector /</text>
  <text x="56" y="418" font-size="10.5" fill="#2C3E50">MLE mesh sim (NOT OpenThread).</text>
  <text x="56" y="438" font-size="10.5" fill="#2C3E50">mt_broker — simulated radio medium,</text>
  <text x="56" y="454" font-size="10.5" fill="#2C3E50">link loss / latency / fault injection.</text>
  <text x="56" y="474" font-size="10.5" fill="#7F8C8D">OpenThread enters only via the bridge,</text>
  <text x="56" y="490" font-size="10.5" fill="#7F8C8D">talking to a real OTBR.</text>
  <text x="56" y="512" font-size="10.5" fill="#C0392B">No Apple Matter API on macOS desktop —</text>
  <text x="56" y="526" font-size="10.5" fill="#C0392B">that path is iOS + HomePod/Apple TV only.</text>

  <!-- Footer legend -->
  <rect x="40" y="566" width="780" height="62" rx="10" ry="10" fill="#F7F9FC" stroke="#BDC3C7" stroke-width="1.2"/>
  <text x="56" y="588" font-size="11" font-weight="bold" fill="#2C3E50">Run it:</text>
  <text x="56" y="606" font-size="10.5" fill="#2C3E50">matterthreads --hw --chip-tool /path/to/chip-tool --otbr http://otbr-host:8081</text>
  <text x="56" y="621" font-size="10" fill="#7F8C8D">Build: cmake -B build -DENABLE_HW_BRIDGE=ON   ·   needs libcurl, a built chip-tool, and a live OTBR (RCP radio)</text>
  <circle cx="600" cy="592" r="5" fill="#4A90D9"/><text x="612" y="596" font-size="10" fill="#2C3E50">Matter / chip-tool</text>
  <circle cx="600" cy="612" r="5" fill="#27AE60"/><text x="612" y="616" font-size="10" fill="#2C3E50">Thread / OpenThread+OTBR</text>
</svg>
