<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <g id="lock">
      <path d="M3,6 v-2 a3,3 0 0 1 6,0 v2" fill="none" stroke="#334155" stroke-width="1.4"/>
      <rect x="1" y="6" width="10" height="8.5" rx="1.5" fill="#fde68a" stroke="#334155" stroke-width="1.2"/>
    </g>
    <style>
      .title { font-size: 24px; font-weight: 700; fill: #0f172a; }
      .sub   { font-size: 13px; fill: #475569; }
      .plane { font-size: 12px; font-weight: 700; letter-spacing: 1px; fill: #64748b; }
      .nodeT { font-size: 14px; font-weight: 700; fill: #0f172a; }
      .nodeS { font-size: 10.5px; fill: #64748b; font-family: SFMono-Regular, Menlo, Consolas, monospace; }
      .cnt   { font-size: 11px; fill: #1e293b; font-family: SFMono-Regular, Menlo, Consolas, monospace; }
      .ok    { fill: #15803d; } .bad { fill: #b91c1c; }
      .mono  { font-family: SFMono-Regular, Menlo, Consolas, monospace; }
      .keyT  { font-size: 14px; font-weight: 700; }
      .keyB  { font-size: 12px; fill: #1e293b; }
    </style>
  </defs>

  <rect x="0" y="0" width="1240" height="800" fill="#f8fafc"/>
  <text x="40" y="38" class="title">Localizing loss without reading payloads &#8212; counter differencing</text>
  <text x="40" y="62" class="sub">Hop-by-hop encryption means no one observer sees the whole path. You reconstruct loss from each node&#8217;s own honest tx/rx counters.</text>

  <!-- ===== MANAGEMENT PLANE ===== -->
  <text x="40" y="92" class="plane">MANAGEMENT PLANE &#183; query each node (cleartext counters)</text>
  <g filter="url(#sh)"><rect x="500" y="100" width="240" height="44" rx="9" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/></g>
  <text x="620" y="128" text-anchor="middle" class="nodeT">Diagnostics collector</text>
  <text x="860" y="116" class="cnt" fill="#4338ca">DIAG_GET cluster 0x0035</text>
  <text x="860" y="132" class="cnt" fill="#4338ca">&#8594; RouteTable (next-hop+cost) + MAC counters</text>

  <!-- query arrows to each node -->
  <line x1="560" y1="144" x2="210" y2="296" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#ag)"/>
  <line x1="600" y1="144" x2="480" y2="296" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#ag)"/>
  <line x1="660" y1="144" x2="760" y2="296" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#ag)"/>
  <line x1="700" y1="144" x2="1040" y2="296" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#ag)"/>

  <!-- ===== DATA PLANE ===== -->
  <text x="40" y="278" class="plane">DATA PLANE &#183; encrypted frames hop the mesh (the real path)</text>

  <!-- nodes -->
  <g filter="url(#sh)"><rect x="115" y="300" width="170" height="72" rx="10" fill="#fff" stroke="#0d9488" stroke-width="1.6"/></g>
  <text x="200" y="326" text-anchor="middle" class="nodeT">Border Router</text>
  <text x="200" y="343" text-anchor="middle" class="nodeS">has network key</text>
  <text x="200" y="362" text-anchor="middle" class="cnt">TxFwd 1000</text>

  <g filter="url(#sh)"><rect x="395" y="300" width="170" height="72" rx="10" fill="#fff" stroke="#2563eb" stroke-width="1.6"/></g>
  <text x="480" y="326" text-anchor="middle" class="nodeT">Router 1</text>
  <text x="480" y="343" text-anchor="middle" class="nodeS">RLOC 0x1400</text>
  <text x="480" y="362" text-anchor="middle" class="cnt">Rx 1000 &#183; TxFwd 1000</text>

  <g filter="url(#sh)"><rect x="675" y="300" width="170" height="72" rx="10" fill="#fff" stroke="#2563eb" stroke-width="1.6"/></g>
  <text x="760" y="326" text-anchor="middle" class="nodeT">Router 2</text>
  <text x="760" y="343" text-anchor="middle" class="nodeS">RLOC 0x2800</text>
  <text x="760" y="362" text-anchor="middle" class="cnt">Rx 720 &#183; TxFwd 720</text>

  <g filter="url(#sh)"><rect x="955" y="300" width="170" height="72" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/></g>
  <text x="1040" y="326" text-anchor="middle" class="nodeT">End Device</text>
  <text x="1040" y="343" text-anchor="middle" class="nodeS">RLOC 0x3401</text>
  <text x="1040" y="362" text-anchor="middle" class="cnt">Rx 715</text>

  <!-- data-plane link arrows (between boxes, y=336) -->
  <!-- link 1: good -->
  <line x1="285" y1="336" x2="395" y2="336" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
  <use href="#lock" x="328" y="320"/>
  <text x="340" y="316" text-anchor="middle" class="cnt">fwd 1000</text>
  <text x="340" y="360" text-anchor="middle" class="cnt ok">rx 1000 &#10003;</text>
  <!-- link 2: BAD -->
  <line x1="565" y1="336" x2="675" y2="336" stroke="#dc2626" stroke-width="3.2" marker-end="url(#ar)"/>
  <use href="#lock" x="608" y="320"/>
  <text x="620" y="316" text-anchor="middle" class="cnt">fwd 1000</text>
  <text x="620" y="360" text-anchor="middle" class="cnt bad" font-weight="700">rx 720 &#8212; LOSS 280 (28%)</text>
  <!-- link 3: good -->
  <line x1="845" y1="336" x2="955" y2="336" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
  <use href="#lock" x="888" y="320"/>
  <text x="900" y="316" text-anchor="middle" class="cnt">fwd 720</text>
  <text x="900" y="360" text-anchor="middle" class="cnt ok">rx 715 &#10003;</text>

  <!-- privacy note -->
  <use href="#lock" x="44" y="398"/>
  <text x="62" y="411" class="sub"><tspan font-weight="700">MAC layer</tspan> encrypted with the network key &#8212; routers forward, they never read the Matter payload (separately <tspan class="mono">CASE</tspan>-encrypted end-to-end). Only counters are visible.</text>

  <!-- ===== ANALYSIS ===== -->
  <rect x="40" y="430" width="1160" height="96" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.4"/>
  <text x="60" y="456" class="keyT" fill="#92400e">Localize without decrypting</text>
  <text x="60" y="482" class="keyB"><tspan class="mono" font-weight="700">link loss = upstream.TxForward &#8722; downstream.RxFrom</tspan></text>
  <text x="60" y="506" class="keyB">R1&#8594;R2:&#160; <tspan class="mono">1000 &#8722; 720 = 280 (28%)</tspan> &#160;&#8658;&#160; <tspan font-weight="700" class="bad">fault localized to link R1&#8211;R2</tspan>. Every value is the node&#8217;s own counter via 0x0035 &#8212; no traffic sniffed, no payload decrypted.</text>

  <!-- ===== CONTRAST ===== -->
  <rect x="40" y="548" width="568" height="218" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="1.4"/>
  <text x="62" y="576" class="keyT" fill="#0e7490">In your SIM &#8212; broker = ground truth</text>
  <text x="62" y="602" class="keyB">&#8226; The broker IS the radio medium: it sees every frame, every hop, every drop.</text>
  <text x="62" y="626" class="keyB">&#8226; Exact path graph + exact per-hop drops + true hop count.</text>
  <text x="62" y="650" class="keyB">&#8226; No diagnostics dance needed &#8212; the medium has the answer.</text>
  <text x="62" y="680" class="keyB" font-weight="700">&#8226; This is what <tspan class="mono">trace &lt;src&gt; &lt;dst&gt;</tspan> prints.</text>
  <text x="62" y="710" class="sub">A sim luxury: real hardware has no such omniscient observer.</text>

  <rect x="632" y="548" width="568" height="218" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="654" y="576" class="keyT" fill="#b91c1c">On real HARDWARE &#8212; diagnostics only</text>
  <text x="654" y="602" class="keyB">&#8226; Topology from each node&#8217;s RouteTable (next-hop + cost).</text>
  <text x="654" y="626" class="keyB">&#8226; Loss localized by differencing tx/rx counters across links.</text>
  <text x="654" y="650" class="keyB">&#8226; Hop count &#8776; hop-limit delta or path cost (weighted, not raw).</text>
  <text x="654" y="680" class="keyB">&#8226; Failing node: <tspan font-weight="700">RTT variance = lagging</tspan>; MAC-retry / LQI trend = leading.</text>
  <text x="654" y="710" class="sub">You infer the path; you never directly observe it.</text>
</svg>
